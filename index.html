<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooperativa Celi Mora</title>
<!--
  Página instalable de la Cooperativa Celi Mora.
  Existe solo para que el acceso directo del celular muestre el logo:
  Apps Script no permite cambiar el ícono de script.google.com.
  - Abierta desde el ícono instalado: lleva directo al portal.
  - Abierta en el navegador: muestra los botones para instalar y para
    abrir el portal (sin redirigir, para poder instalarla).
-->
<meta name="theme-color" content="#013364">
<meta name="description" content="Portal de administración de la Cooperativa Celi Mora">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icono-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icono-180.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    background: #FFFFFF; color: #101828;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px;
    text-align: center;
  }
  img { width: 180px; margin-bottom: 8px; }
  .instalada img { animation: latido 1.6s ease-in-out infinite; }
  @keyframes latido { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  h1 { font-size: 18px; font-weight: 800; }
  p { font-size: 14px; color: #5E6B82; max-width: 320px; line-height: 1.45; }
  .boton {
    display: inline-block; width: 240px; padding: 13px 22px; border-radius: 999px; border: none;
    font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; font-family: inherit;
  }
  .primario { background: #FF8700; color: #FFFFFF; }
  .secundario { background: #013364; color: #FFFFFF; }
  .oculto { display: none !important; }
</style>
</head>
<body>
  <img src="logo-completo-360.png" alt="Cooperativa Celi Mora">

  <!-- Vista en el navegador -->
  <div id="vistaNavegador" class="oculto" style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <h1>Portal de administración</h1>
    <button id="instalar" class="boton primario oculto">Instalar aplicación</button>
    <p id="ayudaInstalar">Para instalarla: abre el menú <b>⋮</b> de Chrome y elige
      <b>"Instalar aplicación"</b> o <b>"Agregar a pantalla de inicio"</b>.</p>
    <a id="abrir" class="boton secundario" href="#">Abrir portal</a>
  </div>

  <!-- Vista desde el ícono instalado -->
  <p id="vistaInstalada" class="oculto">Abriendo el portal…</p>

<script>
  // Dirección del portal publicado en Apps Script (implementación de la
  // aplicación web). Si cambias de implementación, actualiza solo esta línea.
  var URL_PORTAL = 'https://script.google.com/macros/s/AKfycbzoLednZVsOXTLAx3tbd2ZBQhPrmUs6MgFrO6NOUhE52DzsseP4zcwHEVMp-d1SYQVyng/exec';

  document.getElementById('abrir').href = URL_PORTAL;

  // Requisito para que Android ofrezca "Instalar app".
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  }

  var instalada = window.matchMedia('(display-mode: standalone)').matches ||
                  window.matchMedia('(display-mode: fullscreen)').matches ||
                  window.navigator.standalone === true;

  if (instalada) {
    document.body.classList.add('instalada');
    document.getElementById('vistaInstalada').classList.remove('oculto');
    setTimeout(function() { window.location.replace(URL_PORTAL); }, 400);
  } else {
    document.getElementById('vistaNavegador').classList.remove('oculto');

    // Chrome avisa cuando la app se puede instalar: se muestra el botón.
    var avisoInstalacion = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      avisoInstalacion = e;
      document.getElementById('instalar').classList.remove('oculto');
      document.getElementById('ayudaInstalar').classList.add('oculto');
    });
    document.getElementById('instalar').addEventListener('click', function() {
      if (!avisoInstalacion) return;
      avisoInstalacion.prompt();
      avisoInstalacion.userChoice.then(function() { avisoInstalacion = null; });
    });
    window.addEventListener('appinstalled', function() {
      document.getElementById('instalar').classList.add('oculto');
      var ayuda = document.getElementById('ayudaInstalar');
      ayuda.innerHTML = '¡Listo! Ya puedes abrir <b>Celi Mora</b> desde el ícono en tu pantalla de inicio.';
      ayuda.classList.remove('oculto');
    });
  }
</script>
</body>
</html>
